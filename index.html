<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .landing-page {
      width: 100vw;
      height: 100vh;
    }

    .landing-page a {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    .landing-page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="landing-page">
    <a href="https://aurthurhub.blogspot.com/2026/09/viralhub247.html">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUNAUciy45wPcNu9bUYQsYbFf2BrDUVIl0fxdIY0NgrA&s=10"
        alt="Landing Page"
      >
    </a>
  </div>

</body>
</html>
